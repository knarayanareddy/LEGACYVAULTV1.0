[workspace]
members = [
    "programs/legacyvault",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto              = "thin"
opt-level        = 3

[profile.test]
opt-level = 0

[workspace.dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl  = { version = "0.30.1", features = [
    "token",
    "token_2022",
    "associated_token",
] }
