name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  anchor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config build-essential

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "PATH=$HOME/.local/share/solana/install/active_release/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Solana
        run: |
          which solana || echo "solana not found in PATH"
          find /home/runner -name solana -type f 2>/dev/null || echo "solana not found in /home/runner"
          solana --version || echo "solana --version failed"
          cargo-build-sbf --version || echo "cargo-build-sbf --version failed"

      - name: Install Anchor
        run: |
          npm install -g @coral-xyz/anchor-cli@0.30.1

      - name: Run Anchor tests
        working-directory: ./legacyvault
        run: |
          npm install --legacy-peer-deps
          anchor test

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: legacyvault_test
        ports:
          - 5433:5432
      redis:
        image: redis:7
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install API dependencies
        working-directory: ./api
        run: npm ci --legacy-peer-deps
      - name: Run API tests
        working-directory: ./api
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/legacyvault_test
          REDIS_URL: redis://localhost:6380
          JWT_SECRET: test-secret

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: ./dashboard
        run: npm ci --legacy-peer-deps
      - name: Run frontend tests
        working-directory: ./dashboard
        run: npm test -- --run
