name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  anchor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config build-essential

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Setup Solana Keypair
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana-keygen new --no-bip39-passphrase -o "$HOME/.config/solana/id.json" || echo "Keypair already exists"
          solana config set --keypair "$HOME/.config/solana/id.json"

      - name: Verify Solana
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          cargo-build-sbf --version

      - name: Install Anchor
        run: |
          npm install -g @coral-xyz/anchor-cli@0.30.1

      - name: Build program + generate IDL
        working-directory: ./legacyvault
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          anchor build

      - name: 🛠️ Patch truncated IDL
        run: npx ts-node scripts/patch_idl.ts

      - name: ✅ Verify IDL surface completeness
        run: npx ts-node scripts/check_idl_surface.ts

      - name: Run Anchor tests
        working-directory: ./legacyvault
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          anchor test --skip-build

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: legacyvault_test
        ports:
          - 5433:5432
      redis:
        image: redis:7
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install API dependencies
        working-directory: ./api
        run: npm ci --legacy-peer-deps
      - name: Run API tests
        working-directory: ./api
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/legacyvault_test
          REDIS_URL: redis://localhost:6380
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          PROGRAM_ID: "7vdXAgisK4CqAo7xgAQ2K5G8Tg6EiVhWrjToJWAWDoyH"
          SOLANA_RPC_ENDPOINT: http://localhost:8899

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: ./dashboard
        run: npm ci --legacy-peer-deps
      - name: Run frontend tests
        working-directory: ./dashboard
        run: npm test -- --run
  indexer-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: legacyvault_test
        ports:
          - 5434:5432
      redis:
        image: redis:7
        ports:
          - 6381:6379

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Indexer dependencies
        working-directory: ./indexer
        run: npm ci --legacy-peer-deps
      - name: Run Indexer tests
        working-directory: ./indexer
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5434/legacyvault_test
          REDIS_URL: redis://localhost:6381
          SOLANA_RPC_URL: https://api.devnet.solana.com
